<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리가 왜 싸웠을까?</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-color: #ffffff;
            --text-color: #212529;
            --primary-color: #4f46e5;
            --border-color: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .hidden {
            display: none !important;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 1.4rem;
            color: var(--primary-color);
            margin-bottom: 8px;
            word-break: keep-all;
        }

        .header p {
            font-size: 0.95rem;
            color: #6b7280;
        }

        .input-group {
            margin-bottom: 24px;
        }

        .input-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            background-color: #fff;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #4338ca;
        }

        .progress-container {
            margin-bottom: 20px;
        }
        
        .progress-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 4px;
        }

        .progress-text {
            font-size: 0.85rem;
            color: #6b7280;
            text-align: right;
            margin-bottom: 4px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background-color: var(--border-color);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background-color: var(--primary-color);
            width: 0%;
            transition: width 0.3s;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 24px;
            word-break: keep-all;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            width: 100%;
            padding: 14px;
            text-align: left;
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            word-break: keep-all;
        }

        .option-btn:hover {
            border-color: var(--primary-color);
            background-color: #f5f3ff;
        }

        .result-card {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 16px;
            background-color: #fafafa;
            text-align: center;
        }

        .result-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: #4b5563;
            margin-bottom: 4px;
        }

        .user-mbti {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .result-score {
            font-size: 2.2rem;
            font-weight: 800;
            color: #ef4444;
            margin: 10px 0;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 600;
            margin-top: 20px;
            margin-bottom: 8px;
            border-left: 4px solid var(--primary-color);
            padding-left: 8px;
        }

        .desc-text {
            font-size: 0.95rem;
            color: #4b5563;
            margin-bottom: 12px;
        }

        ul {
            padding-left: 20px;
            font-size: 0.95rem;
            color: #4b5563;
        }

        li {
            margin-bottom: 6px;
            word-break: keep-all;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="home-screen">
        <div class="header">
            <h1>우리가 싸운 건 누구의 잘못일까?</h1>
            <p>서로의 성향을 구체적으로 분석해 진짜 갈등 원인을 찾습니다.</p>
        </div>
        
        <div class="input-group">
            <label for="user-nickname">당신의 닉네임</label>
            <input type="text" id="user-nickname" placeholder="이름이나 별명을 입력해 주세요" autocomplete="off">
        </div>

        <button class="btn" onclick="startMyTest()">정밀 성격 유형 검사 시작</button>
    </div>

    <div id="question-screen" class="hidden">
        <div class="progress-container">
            <div id="progress-title" class="progress-title">1단계: 나의 성향 분석중</div>
            <div id="progress-text" class="progress-text">0 / 0</div>
            <div class="progress-bar">
                <div id="progress" class="progress"></div>
            </div>
        </div>
        <div id="question-text" class="question-text">질문 내용</div>
        <div id="options" class="options-list"></div>
    </div>

    <div id="result-screen" class="hidden">
        <div class="header">
            <h1>궁합 및 갈등 분석 리포트</h1>
            <p>의사소통 가이드와 대화 팁을 확인해 보세요.</p>
        </div>

        <div class="result-card">
            <div class="result-title">우리 관계의 소통 점수</div>
            <div id="result-score" class="result-score">0점</div>
            <div id="result-match-names" style="font-size:0.9rem; color:#6b7280;">나(XX) 🤝 상대방(XX)</div>
        </div>

        <div class="section-title">⚠️ 주요 갈등 원인 분석</div>
        <p id="conflict-point" class="desc-text"></p>

        <div class="section-title">💡 상황별 행동 가이드</div>
        <ul id="action-guide"></ul>

        <div class="section-title">💬 추천 대화법 및 팁</div>
        <ul id="tip-list"></ul>

        <button class="btn" style="margin-top: 24px;" onclick="restart()">처음부터 다시 하기</button>
    </div>
</div>

<script>
    // 질문지 확장 (나와 상대방 검사용 각각 8문항씩 구성하여 정확성 제고)
    // 1~2: E/I, 3~4: S/N, 5~6: T/F, 7~8: J/P
    const myQuestions = [
        { text: "Q1. 갈등이 생겨 속상할 때, 나는 주로 어떻게 행동하나요?", options: [{ text: "친구들을 만나서 대화로 털어놓으며 스트레스를 푼다.", type: "E" }, { text: "혼자만의 시간을 가지며 방에서 조용히 생각을 정리한다.", type: "I" }] },
        { text: "Q2. 상대방과 다툰 직후, 내가 더 편하게 느끼는 소통 방식은?", options: [{ text: "가능하면 그 자리에서 바로 대화해 오해를 풀고 싶다.", type: "E" }, { text: "일단 감정을 추스를 혼자만의 시간이 필요하다.", type: "I" }] },
        { text: "Q3. 대화나 다툼 도중 내가 더 중요하게 파악하는 흐름은?", options: [{ text: "현재 일어난 구체적인 사실들과 정확한 당시 정황", type: "S" }, { text: "말 속에 담긴 뉘앙스, 분위기, 그리고 관계의 미래 가능성", type: "N" }] },
        { text: "Q4. 지난 싸움의 원인을 되짚어볼 때 나는 어떻게 기억하나요?", options: [{ text: "상대가 했던 말의 단어, 정확한 행동 순서를 사실 그대로 기억한다.", type: "S" }, { text: "당시 느꼈던 전반적인 느낌과 나쁜 감정의 흐름 위주로 기억한다.", type: "N" }] },
        { text: "Q5. 신경 쓰이는 서운한 일이 생겼을 때 나의 첫 마음가짐은?", options: [{ text: "이유를 먼저 냉정하게 묻고 상황의 잘잘못을 파악하려 한다.", type: "T" }, { text: "불편함을 참거나, 내 감정이 상했음을 즉시 알아주길 바란다.", type: "F" }] },
        { text: "Q6. 상대방이 힘든 일을 털어놓을 때 내가 건네는 주된 반응은?", options: [{ text: "상황을 해결할 수 있는 현실적인 조언과 타개책을 먼저 생각한다.", type: "T" }, { text: "마음이 많이 상했겠다며 감정에 온전히 공감하고 위로한다.", type: "F" }] },
        { text: "Q7. 연인이나 친구와 데이트/여행 계획을 세울 때 나는?", options: [{ text: "시간, 장소, 동선, 대안까지 미리 꼼꼼히 짜두는 게 마음 편하다.", type: "J" }, { text: "큰 틀만 정해두고 그때그때 기분에 맞춰 유연하게 다니는 게 좋다.", type: "P" }] },
        { text: "Q8. 약속 시간에 상대방이 지각했을 때 나에게 드는 생각은?", options: [{ text: "미리 양해를 구하지 않았거나 약속을 어긴 정황 자체에 화가 난다.", type: "J" }, { text: "그럴 만한 사정이 있겠지 생각하며 내 상황에 맞춰 유연하게 기다린다.", type: "P" }] }
    ];

    const partnerQuestions = [
        { text: "Q1. 상대방은 힘든 일이 있을 때 주로 어떻게 행동하나요?", options: [{ text: "밖으로 나가 사람들을 만나거나 활동적으로 움직이며 푼다.", type: "E" }, { text: "연락을 잠시 줄이고 혼자 동굴 속으로 들어가는 편이다.", type: "I" }] },
        { text: "Q2. 나와 다툰 직후 상대방이 취하는 일반적인 태도는?", options: [{ text: "문제를 바로 이야기하고 당장 답을 얻으려고 압박하는 편이다.", type: "E" }, { text: "말을 아끼거나 상황을 회피하며 생각할 시간을 달라고 한다.", type: "I" }] },
        { text: "Q3. 대화할 때 상대방이 선호하는 설명 방식은 어떤가요?", options: [{ text: "현실적이고 구체적인 예시나 눈에 보이는 증거를 대는 편이다.", type: "S" }, { text: "비유적인 표현이나 추상적인 개념, 아이디어를 많이 던지는 편이다.", type: "N" }] },
        { text: "Q4. 과거의 일에 대해 이야기할 때 상대방의 기억 방식은?", options: [{ text: "세부적인 팩트와 정황을 아주 정확하게 짚어낸다.", type: "S" }, { text: "전체적인 분위기나 의미는 기억하지만 구체적 정황은 흐릿하다.", type: "N" }] },
        { text: "Q5. 다툴 때 상대방이 나에게 상처를 주는 주된 방식은?", options: [{ text: "지나치게 차갑고 논리적인 말(팩폭)로 쏘아붙여 로봇처럼 느껴진다.", type: "T" }, { text: "감정이 격해져서 비난 섞인 말투나 홧김에 서운함을 쏟아낸다.", type: "F" }] },
        { text: "Q6. 내가 속상한 이야기를 할 때 상대방이 주로 보이는 반응은?", options: [{ text: "내 이야기의 모순을 지적하거나 해결책을 자꾸 제시하려 든다.", type: "T" }, { text: "내 편을 들어주며 감정적으로 크게 맞장구쳐주고 위로한다.", type: "F" }] },
        { text: "Q7. 상대방과 함께 일정을 소화할 때 상대방의 조율 방식은?", options: [{ text: "미리 정해진 규칙이나 시간표대로 딱딱 움직이는 걸 선호한다.", type: "J" }, { text: "계획이 틀어지거나 즉흥적인 상황이 생겨도 유연하게 즐긴다.", type: "P" }] },
        { text: "Q8. 상대방의 평소 생활 패턴이나 마감 기한을 대하는 태도는?", options: [{ text: "할 일을 미루지 않고 계획적으로 미리미리 끝내두는 편이다.", type: "J" }, { text: "마지막 직전까지 미루다가 벼락치기로 유연하게 처리하는 편이다.", type: "P" }] }
    ];

    // T-F 기반 정밀 궁합 데이터베이스
    const resultDatabase = {
        "T-T": { score: "80점", conflict: "서로 이성적인 논리만 내세우다 감정이 깊게 상할 수 있습니다. 팩트 체킹에 몰두하다 대화가 잘잘못을 가리는 법정 공방처럼 변하곤 합니다.", guides: ["팩트를 짚되, 서로를 비난하는 말투는 삼가세요.", "자존심을 세우기보다 문제 해결을 위한 타협점을 찾으세요."], tips: ["'네 말이 맞는데, 내 생각은 이래'처럼 상대 인정하기.", "논쟁이 과열되면 대화를 잠시 멈추고 10분간 휴식하기."] },
        "T-F": { score: "45점", conflict: "T는 문제를 해결하려 하고, F는 위로받고 싶어 합니다. T의 직설적 조언이 F에게는 상처가 되고, F의 서운함 표현은 T를 지치게 만듭니다.", guides: ["T 성향은 조언하기 전에 '많이 속상했겠다' 공감을 먼저 하세요.", "F 성향은 서운한 기분만 앞세우기보다 원하는 바를 명확히 말해보세요."], tips: ["T에게: '공감 5분 먼저 하고 의견 말하기' 규칙 쓰기.", "F에게: 상대 조언이 공격이 아닌 도우려는 마음임을 기억하기."] },
        "F-T": { score: "45점", conflict: "F인 내가 서운함을 표현할 때 상대방이 지나치게 이성적으로 분석하여 오해가 깊어질 수 있고, 나를 무시한다고 느끼기 쉽습니다.", guides: ["대화를 시작할 때 '지금은 내 기분을 그냥 먼저 들어줘'라고 요청하세요.", "상대방이 결론을 내리려 해도 나를 공격하는 게 아님을 인지하세요."], tips: ["'너는 맨날 그래' 대신 '네가 그렇게 말하니 내 마음이 슬퍼'(I-Message) 쓰기.", "감정이 격해졌을 땐 잠시 텍스트나 편지로 속마음 전달해 보기."] },
        "F-F": { score: "90점", conflict: "평소에는 공감이 잘 되지만, 갈등이 생기면 서로 상처받을까 봐 속마음을 참다가 오해가 쌓여 한 번에 크게 터질 위험이 있습니다.", guides: ["불편한 감정이 생기면 꽁해있지 말고 부드러운 어조로 솔직하게 털어놓으세요.", "상대의 서운함 표현을 나에 대한 '거절'이나 '공격'으로 해석하지 마세요."], tips: ["평소에 좋았던 점과 서운했던 점을 주기적으로 가볍게 나누기.", "갈등을 회피하기보다는 따뜻한 위로의 말로 먼저 문을 열기."] }
    };

    let nickname = "";
    let currentMode = "my"; // "my" or "partner"
    let currentIdx = 0;
    
    let myScores = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };
    let partnerScores = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };
    
    let myFinalMBTI = "";
    let partnerFinalMBTI = "";

    function startMyTest() {
        const inputName = document.getElementById("user-nickname").value.trim();
        nickname = inputName ? inputName : "사용자";

        document.getElementById("home-screen").classList.add("hidden");
        document.getElementById("question-screen").classList.remove("hidden");
        
        currentMode = "my";
        currentIdx = 0;
        myScores = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };
        showQuestion();
    }

    function showQuestion() {
        const questionsList = (currentMode === "my") ? myQuestions : partnerQuestions;

        // 질문이 끝난 경우의 분기 처리
        if (currentIdx >= questionsList.length) {
            if (currentMode === "my") {
                // 내 검사 끝 -> 상대방 검사로 전환
                myFinalMBTI = calculateMBTI(myScores);
                currentMode = "partner";
                currentIdx = 0;
                partnerScores = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };
                showQuestion();
            } else {
                // 상대방 검사까지 완전히 끝남 -> 결과 출력
                partnerFinalMBTI = calculateMBTI(partnerScores);
                showAnalysis();
            }
            return;
        }

        // 프로그레스 바 및 UI 상태 조절
        if (currentMode === "my") {
            document.getElementById("progress-title").innerText = `1단계: ${nickname}님의 성향 검사`;
        } else {
            document.getElementById("progress-title").innerText = `2단계: 상대방의 패턴 검사`;
        }

        document.getElementById("progress-text").innerText = `${currentIdx + 1} / ${questionsList.length}`;
        const percent = (currentIdx / questionsList.length) * 100;
        document.getElementById("progress").style.width = `${percent}%`;

        const q = questionsList[currentIdx];
        document.getElementById("question-text").innerText = q.text;
        
        const optionsDiv = document.getElementById("options");
        optionsDiv.innerHTML = "";

        q.options.forEach(opt => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt.text;
            btn.onclick = () => {
                if (currentMode === "my") {
                    myScores[opt.type]++;
                } else {
                    partnerScores[opt.type]++;
                }
                currentIdx++;
                showQuestion();
            };
            optionsDiv.appendChild(btn);
        });
    }

    function calculateMBTI(scoreObj) {
        const E_I = scoreObj.E >= scoreObj.I ? "E" : "I";
        const S_N = scoreObj.S >= scoreObj.N ? "S" : "N";
        const T_F = scoreObj.T >= scoreObj.F ? "T" : "F";
        const J_P = scoreObj.J >= scoreObj.P ? "J" : "P";
        return E_I + S_N + T_F + J_P;
    }

    function showAnalysis() {
        document.getElementById("question-screen").classList.add("hidden");
        document.getElementById("result-screen").classList.remove("hidden");

        const myTF = myFinalMBTI.charAt(2);
        const partnerTF = partnerFinalMBTI.charAt(2);
        const matchKey = `${myTF}-${partnerTF}`;

        const result = resultDatabase[matchKey];

        // 데이터 반영
        document.getElementById("result-score").innerText = result.score;
        document.getElementById("result-match-names").innerText = `${nickname}(${myFinalMBTI}) 🤝 상대방(${partnerFinalMBTI})`;
        document.getElementById("conflict-point").innerText = result.conflict;

        // 가이드 출력
        const guideUl = document.getElementById("action-guide");
        guideUl.innerHTML = "";
        result.guides.forEach(g => {
            const li = document.createElement("li");
            li.innerText = g;
            guideUl.appendChild(li);
        });

        // 팁 출력
        const tipUl = document.getElementById("tip-list");
        tipUl.innerHTML = "";
        result.tips.forEach(t => {
            const li = document.createElement("li");
            li.innerText = t;
            tipUl.appendChild(li);
        });
    }

    function restart() {
        document.getElementById("user-nickname").value = "";
        document.getElementById("result-screen").classList.add("hidden");
        document.getElementById("home-screen").classList.remove("hidden");
    }
</script>
</body>
</html>
