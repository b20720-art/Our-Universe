<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리가 왜 싸웠을까?</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-color: #ffffff;
            --text-color: #212529;
            --primary-color: #4f46e5;
            --border-color: #e5e7eb;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 480px; background: var(--card-color); border-radius: 16px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .hidden { display: none !important; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 1.4rem; color: var(--primary-color); margin-bottom: 8px; word-break: keep-all; }
        .header p { font-size: 0.95rem; color: #6b7280; }
        .input-group { margin-bottom: 24px; }
        .input-group label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; }
        input[type="text"], select { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem; background-color: #fff; outline: none; }
        .btn { width: 100%; padding: 14px; background-color: var(--primary-color); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .progress-container { margin-bottom: 20px; }
        .progress-text { font-size: 0.85rem; color: #6b7280; text-align: right; margin-bottom: 4px; }
        .progress-bar { width: 100%; height: 6px; background-color: var(--border-color); border-radius: 3px; overflow: hidden; }
        .progress { height: 100%; background-color: var(--primary-color); width: 0%; transition: width 0.3s; }
        .question-text { font-size: 1.1rem; font-weight: 600; margin-bottom: 24px; word-break: keep-all; }
        .options-list { display: flex; flex-direction: column; gap: 12px; }
        .option-btn { width: 100%; padding: 14px; text-align: left; background: #fff; border: 1px solid var(--border-color); border-radius: 8px; font-size: 0.95rem; cursor: pointer; word-break: keep-all; }
        .option-btn:hover { border-color: var(--primary-color); background-color: #f5f3ff; }
        .result-card { border: 1px solid var(--border-color); border-radius: 12px; padding: 18px; margin-bottom: 16px; background-color: #fafafa; text-align: center; }
        .result-title { font-weight: 600; font-size: 0.95rem; color: #4b5563; }
        .user-mbti { font-size: 1.6rem; font-weight: 800; color: var(--primary-color); margin-bottom: 10px; }
        .result-score { font-size: 2.2rem; font-weight: 800; color: #ef4444; margin: 10px 0; }
        .section-title { font-size: 1rem; font-weight: 600; margin-top: 20px; margin-bottom: 8px; border-left: 4px solid var(--primary-color); padding-left: 8px; }
        .desc-text { font-size: 0.95rem; color: #4b5563; margin-bottom: 12px; }
        ul { padding-left: 20px; font-size: 0.95rem; color: #4b5563; }
        li { margin-bottom: 6px; word-break: keep-all; }
    </style>
</head>
<body>
<div class="container">
    <div id="home-screen">
        <div class="header">
            <h1>우리가 싸운 건 누구의 잘못일까?</h1>
            <p>단순 궁합을 넘어 실제 갈등 원인을 찾아봅니다.</p>
        </div>
        <div class="input-group">
            <label for="user-nickname">당신의 닉네임</label>
            <input type="text" id="user-nickname" placeholder="이름이나 별명을 입력해 주세요" autocomplete="off">
        </div>
        <button class="btn" onclick="startTest()">나의 MBTI 검사 시작하기</button>
    </div>

    <div id="question-screen" class="hidden">
        <div class="progress-container">
            <div id="progress-text" class="progress-text">0 / 0</div>
            <div class="progress-bar"><div id="progress" class="progress"></div></div>
        </div>
        <div id="question-text" class="question-text">질문 내용</div>
        <div id="options" class="options-list"></div>
    </div>

    <div id="partner-screen" class="hidden">
        <div class="header">
            <h1>검사 완료!</h1>
            <p>이제 분석할 상대방의 정보를 입력해 주세요.</p>
        </div>
        <div class="result-card">
            <div id="detected-my-info" class="result-title">나의 MBTI 결과</div>
            <div id="my-mbti-result" class="user-mbti">ESTJ</div>
        </div>
        <div class="input-group">
            <label for="partner-mbti">상대방의 MBTI 선택</label>
            <select id="partner-mbti">
                <option value="ISTJ">ISTJ</option><option value="ISFJ">ISFJ</option><option value="INFJ">INFJ</option><option value="INTJ">INTJ</option>
                <option value="ISTP">ISTP</option><option value="ISFP">ISFP</option><option value="INFP">INFP</option><option value="INTP">INTP</option>
                <option value="ESTP">ESTP</option><option value="ESFP">ESFP</option><option value="ENFP">ENFP</option><option value="ENTP">ENTP</option>
                <option value="ESTJ">ESTJ</option><option value="ESFJ">ESFJ</option><option value="ENFJ">ENFJ</option><option value="ENTJ">ENTJ</option>
            </select>
        </div>
        <button class="btn" onclick="showAnalysis()">갈등 해결 솔루션 보기</button>
    </div>

    <div id="result-screen" class="hidden">
        <div class="header">
            <h1>궁합 및 갈등 분석 리포트</h1>
            <p>의사소통 가이드와 대화 팁을 확인해 보세요.</p>
        </div>
        <div class="result-card">
            <div class="result-title">우리 관계의 소통 점수</div>
            <div id="result-score" class="result-score">0점</div>
            <div id="result-match-names" style="font-size:0.9rem; color:#6b7280;">나 🤝 상대방</div>
        </div>
        <div class="section-title">⚠️ 주요 갈등 원인 분석</div>
        <p id="conflict-point" class="desc-text"></p>
        <div class="section-title">💡 상황별 행동 가이드</div>
        <ul id="action-guide"></ul>
        <div class="section-title">💬 추천 대화법 및 팁</div>
        <ul id="tip-list"></ul>
        <button class="btn" style="margin-top: 24px;" onclick="restart()">처음부터 다시 하기</button>
    </div>
</div>

<script>
    const questions = [
        { text: "갈등이 생겨 속상할 때, 나는 대개 어떻게 스트레스를 푸나요?", options: [{ text: "친구들을 만나서 이야기를 털어놓으며 에너지를 얻는다.", type: "E" }, { text: "혼자만의 시간을 가지며 조용히 생각을 정리한다.", type: "I" }] },
        { text: "상대방과 다툰 직후, 내가 선호하는 행동은?", options: [{ text: "그 자리에서 바로 대화로 오해를 풀고 싶다.", type: "E" }, { text: "일단 감정을 추스를 혼자만의 시간이 필요하다.", type: "I" }] },
        { text: "상대방과 대화할 때 내가 더 중요하게 여기는 흐름은?", options: [{ text: "현재 일어난 구체적인 사실과 정확한 정황", type: "S" }, { text: "대화 이면에 담긴 분위기나 행간의 의미, 미래의 가능성", type: "N" }] },
        { text: "싸움의 원인을 되짚어볼 때 나는 주로 어떻게 기억하나요?", options: [{ text: "상대가 했던 말, 행동, 순서 등을 사실 그대로 기억한다.", type: "S" }, { text: "당시 느꼈던 전반적인 느낌과 나쁜 감정의 흐름 위주로 기억한다.", type: "N" }] },
        { text: "크게 신경 쓰이는 서운한 일이 생겼을 때 나의 첫 대처는?", options: [{ text: "이유를 먼저 묻고 논리적으로 잘잘못을 따져본다.", type: "T" }, { text: "불편하지만 참거나, 감정적으로 서운함을 먼저 표출한다.", type: "F" }] },
        { text: "상대방이 힘든 일을 털어놓을 때 내가 건네는 대답은?", options: [{ text: "상황을 해결할 수 있는 현실적인 조언과 해결책을 찾는다.", type: "T" }, { text: "마음이 많이 상했겠다며 적극적으로 위로하고 감정에 공감한다.", type: "F" }] },
        { text: "다툴 때 상대방의 말 중 더 상처받는 부분은?", options: [{ text: "내 행동의 모순을 지적하는 차갑고 이성적인 팩트 폭행", type: "T" }, { text: "날 비난하거나 무시하는 듯한 거친 말투와 감정적인 태도", type: "F" }] },
        { text: "연인/친구와 데이트나 여행 계획을 세울 때 나의 성향은?", options: [{ text: "시간 wine 장소, 동선을 미리 꼼꼼하게 짜두어야 마음이 편하다.", type: "J" }, { text: "그때그때 상황과 기분에 맞춰 유연하게 움직이는 게 좋다.", type: "P" }] },
        { text: "약속 시간에 상대방이 지각했을 때 드는 생각은?", options: [{ text: "미리 연락을 주거나 계획을 지키지 않은 행동에 화가 난다.", type: "J" }, { text: "그럴 수도 있지 하며 상황에 맞춰 유연하게 기다린다.", type: "P" }] }
    ];

    const resultDatabase = {
        "T-T": { score: "80점", conflict: "서로 이성적인 논리만 내세우다 감정이 깊게 상할 수 있습니다. 잘잘못을 가리는 법정 공방처럼 변하곤 합니다.", guides: ["팩트를 짚되, 서로를 비난하는 말투는 삼가세요.", "자존심을 세우기보다 문제 해결을 위한 타협점을 찾으세요."], tips: ["'네 말이 맞는데, 내 생각은 이래'처럼 상대 인정하기.", "논쟁이 과열되면 대화를 잠시 멈추고 10분간 휴식하기."] },
        "T-F": { score: "45점", conflict: "T는 문제를 해결하려 하고, F는 위로받고 싶어 합니다. T의 직설적 조언이 F에게는 상처가 되고, F의 서운함 표현은 T를 지치게 만듭니다.", guides: ["T 성향은 조언하기 전에 '많이 속상했겠다' 공감을 먼저 하세요.", "F 성향은 서운한 기분만 앞세우기보다 원하는 바를 명확히 말해보세요."], tips: ["T에게: '공감 5분 먼저 하고 의견 말하기' 규칙 쓰기.", "F에게: 상대 조언이 공격이 아닌 도우려는 마음임을 기억하기."] },
        "F-T": { score: "45점", conflict: "F인 내가 서운함을 표현할 때 상대방이 지나치게 이성적으로 분석하여 오해가 깊어질 수 있고, 나를 무시한다고 느끼기 쉽습니다.", guides: ["대화를 시작할 때 '지금은 내 기분을 그냥 먼저 들어줘'라고 요청하세요.", "상대방이 결론을 내리려 해도 나를 공격하는 게 아님을 인지하세요."], tips: ["'너는 맨날 그래' 대신 '네가 그렇게 말하니 내 마음이 슬퍼'(I-Message) 쓰기.", "감정이 격해졌을 땐 잠시 텍스트나 편지로 속마음 전달해 보기."] },
        "F-F": { score: "90점", conflict: "평소에는 공감이 잘 되지만, 갈등이 생기면 서로 상처받을까 봐 속마음을 참다가 오해가 쌓여 한 번에 크게 터질 위험이 있습니다.", guides: ["불편한 감정이 생기면 꽁해있지 말고 부드러운 어조로 솔직하게 털어놓으세요.", "상대의 서운함 표현을 나에 대한 '거절'이나 '공격'으로 해석하지 마세요."], tips: ["평소에 좋았던 점과 서운했던 점을 주기적으로 가볍게 나누기.", "갈등을 회피하기보다는 따뜻한 위로의 말로 먼저 문을 열기."] }
    };

    let nickname = "", currentIdx = 0, myFinalMBTI = "";
    let scores = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };

    function startTest() {
        const inputName = document.getElementById("user-nickname").value.trim();
        nickname = inputName ? inputName : "사용자";
        document.getElementById("home-screen").classList.add("hidden");
        document.getElementById("question-screen").classList.remove("hidden");
        currentIdx = 0;
        scores = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };
        showQuestion();
    }

    function showQuestion() {
        if (currentIdx >= questions.length) { calculateMyMBTI(); return; }
        document.getElementById("progress-text").innerText = `${currentIdx + 1} / ${questions.length}`;
        document.getElementById("progress").style.width = `${(currentIdx / questions.length) * 100}%`;
        const q = questions[currentIdx];
        document.getElementById("question-text").innerText = q.text;
        const optionsDiv = document.getElementById("options"); optionsDiv.innerHTML = "";
        q.options.forEach(opt => {
            const btn = document.createElement("button"); btn.className = "option-btn"; btn.innerText = opt.text;
            btn.onclick = () => { scores[opt.type]++; currentIdx++; showQuestion(); };
            optionsDiv.appendChild(btn);
        });
    }

    function calculateMyMBTI() {
        const E_I = scores.E >= scores.I ? "E" : "I";
        const S_N = scores.S >= scores.N ? "S" : "N";
        const T_F = scores.T >= scores.F ? "T" : "F";
        const J_P = scores.J >= scores.P ? "J" : "P";
        myFinalMBTI = E_I + S_N + T_F + J_P;
        document.getElementById("question-screen").classList.add("hidden");
        document.getElementById("partner-screen").classList.remove("hidden");
        document.getElementById("detected-my-info").innerText = `✨ ${nickname}님의 분석된 MBTI`;
        document.getElementById("my-mbti-result").innerText = myFinalMBTI;
    }

    function showAnalysis() {
        const partnerMBTI = document.getElementById("partner-mbti").value;
        document.getElementById("partner-screen").classList.add("hidden");
        document.getElementById("result-screen").classList.remove("hidden");
        const myTF = myFinalMBTI.charAt(2), partnerTF = partnerMBTI.charAt(2);
        const result = resultDatabase[`${myTF}-${partnerTF}`];
        document.getElementById("result-score").innerText = result.score;
        document.getElementById("result-match-names").innerText = `${nickname}(${myFinalMBTI}) 🤝 상대방(${partnerMBTI})`;
        document.getElementById("conflict-point").innerText = result.conflict;
        const guideUl = document.getElementById("action-guide"); guideUl.innerHTML = "";
        result.guides.forEach(g => { const li = document.createElement("li"); li.innerText = g; guideUl.appendChild(li); });
        const tipUl = document.getElementById("tip-list"); tipUl.innerHTML = "";
        result.tips.forEach(t => { const li = document.createElement("li"); li.innerText = t; tipUl.appendChild(li); });
    }

    function restart() { document.getElementById("user-nickname").value = ""; document.getElementById("result-screen").classList.add("hidden"); document.getElementById("home-screen").classList.remove("hidden"); }
</script>
</body>
</html>
